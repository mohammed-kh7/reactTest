<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Store</title>
    <style>
      body { background-color: #050811; margin: 0; }
      .error-screen { color: #fca5a5; padding: 40px; text-align: center; font-family: sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      window.addEventListener('error', function(e) {
        console.error('Global error:', e.error);
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div class="error-screen"><h2>JavaScript Error</h2><p>' + (e.error?.message || e.message) + '</p></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled promise rejection:', e.reason);
      });
    </script>
    <script type="module" src="/src/main-debug.jsx"></script>
  </body>
</html>
